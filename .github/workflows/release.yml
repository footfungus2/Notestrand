name: Release build

# Builds Notestrand.tipa and Notestrand.ipa (the same build under both names).
# Pushing a tag like v0.2.0 publishes them as a release, which the in-app updater picks up.
# A manual run only attaches them to the run, for checking.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION \"$version\" in project.yml. The in-app updater compares the two."
            exit 1
          fi

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Build
        run: |
          xcodebuild -version
          ./build.sh
          cp build/Notestrand.tipa build/Notestrand.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Notestrand
          path: |
            build/Notestrand.tipa
            build/Notestrand.ipa

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Notestrand ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" build/Notestrand.tipa build/Notestrand.ipa --clobber
