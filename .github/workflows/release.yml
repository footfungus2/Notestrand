name: Release build

# Builds Notestrand.tipa and Notestrand.ipa (the same build under both names).
# Pushing a tag like v0.2.0 publishes them as a release, which the in-app updater picks up.
# A manual run only attaches them to the run, for checking.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the full-changelog link

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION \"$version\" in project.yml. The in-app updater compares the two."
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          # Everything under "## <version>" up to the next "## " heading.
          awk -v v="$version" '/^## /{ if (p) exit; if ($2 == v) { p = 1; next } } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no \"## $version\" section. Add one before tagging."
            exit 1
          fi
          previous=$(git tag --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -1)
          if [ -n "$previous" ]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> notes.md
          fi

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Build
        run: |
          xcodebuild -version
          ./build.sh
          cp build/Notestrand.tipa build/Notestrand.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Notestrand
          path: |
            build/Notestrand.tipa
            build/Notestrand.ipa

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Notestrand ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" build/Notestrand.tipa build/Notestrand.ipa --clobber
